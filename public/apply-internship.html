<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aronofy</title>
 <link rel="icon" href="/images/aronofy logo.png" type="image/png" />
  <link rel="stylesheet" href="/CSS/style.css" />
  <link rel="stylesheet" href="/CSS/media.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
</head>
<body style="margin-top: 93px;">

     <div id="header"></div>



<main class="container py-4">
  <div class="d-flex align-items-center mb-3">
    <h3 class="mb-0">Edit Profile</h3>
  </div>

  <form id="applyForm" class="card shadow-sm p-3 needs-validation" novalidate>
    <div class="row g-3">
      <!-- Photo Upload -->
      <div class="col-12 col-md-4 text-center">
        <img id="photoPreview" src="https://placehold.co/360x240?text=Upload+Photo" alt="Candidate Photo" class="img-fluid rounded border p-1 bg-white">
        <div class="mt-2">
          <input type="file" class="form-control form-control-sm" id="candidatePhoto" accept="image/*">
        </div>
      </div>

      <!-- Form fields -->
      <div class="col-12 col-md-8">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="fullName" required>
            <div class="invalid-feedback">Full Name is required.</div>
          </div>

          <div class="col-md-6">
            <label class="form-label">Designation</label>
            <input type="text" class="form-control" id="currentDesignation" required>
            <div class="invalid-feedback">Designation is required.</div>
          </div>

          <div class="col-md-6">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" id="location">
          </div>

          <div class="col-md-6">
            <label class="form-label">Date of Birth</label>
            <input type="date" class="form-control" id="dob">
          </div>

          <div class="col-md-6">
            <label class="form-label">Experience (Current Role)</label>
            <input type="text" class="form-control" id="candidateExperience" placeholder="e.g. ROle">
          </div>

          <div class="col-md-6">
            <label class="form-label">Total Experience (Years)</label>
            <input type="number" min="0" class="form-control" id="experienceYears" placeholder="e.g. 5">
          </div>

          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input type="tel" class="form-control" id="phone">
          </div>

          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email">
          </div>

          <div class="col-md-6">
            <label class="form-label">LinkedIn</label>
            <input type="url" class="form-control" id="linkedin" placeholder="https://linkedin.com/in/...">
          </div>

          <div class="col-md-6">
            <label class="form-label">Upload Resume</label>
            <input type="file" class="form-control" id="resume" accept=".pdf,.doc,.docx">
          </div>

          <div class="col-12">
            <label class="form-label">Education</label>
            <textarea class="form-control" id="education" rows="2"></textarea>
          </div>

          <div class="col-12">
            <label class="form-label">Skills</label>
            <textarea class="form-control" id="skills" rows="2" placeholder="e.g. JavaScript, React, Node.js"></textarea>
          </div>
        </div>

        <div class="mt-3 text-end">
          <button type="submit" class="btn btn-primary">Apply Internship</button>
        </div>
      </div>
    </div>
  </form>
</main>


      <div id="footer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
    integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous">
  </script>
  <script src="/JS/work.js"></script>
  <script src="/JS/header.js"></script>
  <script src="/JS/footer.js"></script>
  <script src="/JS/site-header.js" ></script>
  <script src="/JS/apply-candidate-fatch.js" ></script>
  <script src="/JS/apply-success.js" ></script>
<script src="/JS/role-based-show-hide.js"></script>
</body>
</html>
