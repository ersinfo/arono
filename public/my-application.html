<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aronofy</title>
 <link rel="icon" href="/images/aronofy logo.png" type="image/png" />
  <link rel="stylesheet" href="/CSS/style.css" />
  <link rel="stylesheet" href="/CSS/media.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
</head>
<body style="margin-top: 93px;">

     <div id="header"></div>

 <div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
 <h2 class="mb-4">My Applications</h2>
 <a href="/my-job-application.html"><button  type="button" class="btn btn-primary">See Job Apply</button></a>
  </div>
   
    <div id="myApplicationsContainer" class="row g-3">
      <!-- Cards will be injected here by JS -->
    </div>
  </div>
     <div id="footer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
    integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous">
  </script>
  <script src="/JS/work.js"></script>
  <script src="/JS/header.js"></script>
  <script src="/JS/footer.js"></script>
  <script src="/JS/site-header.js" ></script>
<script src="/JS/role-based-show-hide.js"></script>
<script>
async function loadMyApplications() {
  const candidateId = localStorage.getItem('candidateId'); // may be absent for recruiters

  try {
    const headers = {};
    if (candidateId) headers['x-candidate-id'] = candidateId;

    const res = await fetch(`/api/application/internship/my-applications`, {
      method: 'GET',
      headers
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`Server error ${res.status}: ${errText}`);
    }

    const data = await res.json();
    const container = document.getElementById('myApplicationsContainer');
    container.innerHTML = '';

    if (!data.applications.length) {
      container.innerHTML = '<p>No applications found.</p>';
      return;
    }

    data.applications.forEach(app => {
      const card = document.createElement('div');
      card.className = 'col-12 col-md-6 col-lg-4';
      card.innerHTML = `
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">${app.title}</h5>
            <p class="card-text"><strong>Company:</strong> ${app.company}</p>
            <p class="card-text"><strong>Location:</strong> ${app.location}</p>
            <p class="card-text"><strong>Type:</strong> ${app.type || '-'}</p>
            <p class="card-text"><strong>Status:</strong> ${app.status}</p>
            <p class="card-text"><strong>Experience:</strong> ${app.experienceYears || '-'}</p>
            <p class="card-text"><small class="text-muted">Applied at: ${new Date(app.appliedAt).toLocaleString()}</small></p>
            <p class="card-text"><strong>Status:</strong> 
              <span class="badge ${getStatusClass(app.status)}">${app.status}</span>
            </p>
          </div>
        </div>
      `;
      container.appendChild(card);
    });

  } catch (err) {
    console.error('Load applications error:', err);
    alert('Failed to load applications: ' + err.message);
  }
}

// Status badge color helper
function getStatusClass(status) {
  switch(status) {
    case 'applied': return 'bg-primary text-white';
    case 'reviewed': return 'bg-info text-white';
    case 'accepted': return 'bg-success text-white';
    case 'rejected': return 'bg-danger text-white';
    default: return 'bg-secondary text-white';
  }
}

// Call the function when page loads
window.addEventListener('DOMContentLoaded', loadMyApplications);
</script>

  </body>
</html>
