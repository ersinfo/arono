<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Internship Post Page</title>
  <link rel="icon" href="/images/aronofy logo.png" type="image/png">
  <link rel="stylesheet" href="/CSS/style.css">
  <link rel="stylesheet" href="/CSS/media.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>

<body class="bg-light" style=" margin-top: 93px;">
<div id="header"></div>
  

  <div class="container my-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="mb-3">Post a Internship</h3>
          <p class="text-muted mb-4">Fill the details below and publish your job.</p>

          <form id="postInternshipForm" class="needs-validation" novalidate>
            <!-- Title -->
            <div class="mb-3">
              <label class="form-label">Job Title <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="title" placeholder="e.g., Frontend Developer" required />
              <div class="invalid-feedback">Please provide a job title.</div>
            </div>

            <!-- Company -->
            <div class="mb-3">
              <label class="form-label">Company <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="company" placeholder="e.g., ERSinfo" required />
              <div class="invalid-feedback">Please provide a company name.</div>
            </div>

            <!-- Location -->
            <div class="mb-3">
              <label class="form-label">Location <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="location" placeholder="e.g., Varanasi / Remote" required />
              <div class="invalid-feedback">Please provide a location.</div>
            </div>

            <!-- Job Type -->
            <div class="mb-3">
              <label class="form-label">Internship Type</label>
              <select class="form-select" name="jobType" id="jobType" required>
                <option value="Full-time" selected>Full-time</option>
                <option value="Part-time">Part-time</option>
                <option value="Internship">Internship</option>
                <option value="Contract">Contract</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <!-- Salary Range (optional) -->
            <div class="mb-3">
              <label class="form-label">Salary Range (optional)</label>
              <div class="row g-2">
                <div class="col-6">
                  <input type="number" class="form-control"  id="salaryMin" name="salaryMin" placeholder="Min (₹)" min="0" />
                </div>
                <div class="col-6">
                  <input type="number" class="form-control"  id="salaryMax" name="salaryMax" placeholder="Max (₹)" min="0" />
                </div>
              </div>
              <div class="form-text">Leave blank if not applicable.</div>
            </div>

            <!-- Requirements -->
            <div class="mb-3">
              <label class="form-label">Requirements (comma separated)</label>
              <input type="text" class="form-control"  id="requirements" name="requirements" placeholder="e.g., React, Node.js, MongoDB" />
            </div>

            <!-- Application Deadline -->
            <div class="mb-3">
              <label class="form-label">Application Deadline (optional)</label>
              <input type="date" class="form-control" name="applicationDeadline" />
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label class="form-label">Job Description <span class="text-danger">*</span></label>
              <textarea class="form-control" name="description" rows="6" placeholder="Describe responsibilities, skills, and benefits..." required></textarea>
              <div class="invalid-feedback">Please provide a job description.</div>
            </div>

            <!-- Active toggle -->
            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="isActive" name="isActive" checked>
              <label class="form-check-label" for="isActive">Active</label>
            </div>

            <div class="d-flex align-items-center gap-3">
              <button class="btn btn-primary" type="submit" id="publishBtn">Publish Internship</button>
              <span id="formMsg" class="small"></span>
            </div>
          </form>
        </div>
      </div>

      <div class="text-center mt-3">
        <a href="/internships" class="text-decoration-none">← Back to Internship</a>
      </div>
    </div>
  </div>
</div>


<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
  integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
  integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
<script src="/JS/work.js"></script>
  <script src="/JS/header.js"></script>
  <script src="/JS/footer.js"></script>
  <script src="/JS/site-header.js"></script>
   <script src="/JS/post-internship.js" defer></script>
<script src="/JS/role-based-show-hide.js"></script>
  </body>

</html>
