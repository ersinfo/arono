<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <link rel="icon" href="/images/aronofy logo.png" type="image/png">
  <link rel="stylesheet" href="/CSS/style.css">
  <link rel="stylesheet" href="/CSS/media.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>

<body style="margin-top:90px;">
  <div id="header"></div>

  <div class="container my-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h3 class="mb-3">Post a Job</h3>
            <p class="text-muted mb-3">Fill details and publish your job. (Only recruiters)</p>

            <form id="postJobForm" class="needs-validation" novalidate>
              <div class="mb-3">
                <label class="form-label">Job Title <span class="text-danger">*</span></label>
                <input id="title" name="title" type="text" class="form-control" placeholder="e.g., Frontend Developer" required />
                <div class="invalid-feedback">Please provide a job title.</div>
              </div>

              <div class="mb-3">
                <label class="form-label">Company <span class="text-danger">*</span></label>
                <input id="company" name="company" type="text" class="form-control" placeholder="e.g., ERSinfo" required />
                <div class="invalid-feedback">Please provide a company name.</div>
              </div>

              <div class="mb-3">
                <label class="form-label">Location <span class="text-danger">*</span></label>
                <input id="location" name="location" type="text" class="form-control" placeholder="e.g., Varanasi / Remote" required />
                <div class="invalid-feedback">Please provide a location.</div>
              </div>

              <div class="mb-3">
                <label class="form-label">Job Type</label>
                <select id="jobType" name="jobType" class="form-select">
                  <option value="Full-time" selected>Full-time</option>
                  <option value="Part-time">Part-time</option>
                  <option value="Internship">Internship</option>
                  <option value="Contract">Contract</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="row g-2 mb-3">
                <div class="col">
                  <input id="salaryMin" name="salaryMin" type="number" class="form-control" placeholder="Salary Min (₹)" min="0" />
                </div>
                <div class="col">
                  <input id="salaryMax" name="salaryMax" type="number" class="form-control" placeholder="Salary Max (₹)" min="0" />
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Requirements (comma separated)</label>
                <input id="requirements" name="requirements" type="text" class="form-control" placeholder="React, Node.js, MongoDB" />
              </div>

              <div class="mb-3">
                <label class="form-label">Application Deadline (optional)</label>
                <input id="applicationDeadline" name="applicationDeadline" type="date" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label">Job Description <span class="text-danger">*</span></label>
                <textarea id="description" name="description" class="form-control" rows="6" placeholder="Describe responsibilities, skills, benefits..." required></textarea>
                <div class="invalid-feedback">Please provide a job description.</div>
              </div>

              <div class="form-check form-switch mb-3">
                <input id="isActive" class="form-check-input" type="checkbox" checked />
                <label class="form-check-label" for="isActive">Active</label>
              </div>

              <div class="d-flex align-items-center gap-3">
                <button id="publishBtn" class="btn btn-primary" type="submit">Publish Job</button>
                <span id="formMsg" class="small text-muted"></span>
              </div>
            </form>

            <div class="mt-3">
              <a href="/jobs">← Back to Jobs</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
  integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
  integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
<script src="/JS/work.js"></script>
  <script src="/JS/header.js"></script>
  <script src="/JS/footer.js"></script>
  <script src="/JS/site-header.js"></script>
  <script src="/JS/post-job.js" defer></script>
<script src="/JS/role-based-show-hide.js"></script>

</body>



</html>
