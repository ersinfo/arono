<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aronofy</title>
 <link rel="icon" href="/images/aronofy logo.png" type="image/png" />
  <link rel="stylesheet" href="/CSS/style.css" />
  <link rel="stylesheet" href="/CSS/media.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
</head>
<body style="margin-top: 93px;">

     <div id="header"></div>

<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center mb-3">

 <h2 class="mb-4">Received Intenship Applications</h2>
<a href="/received-job-application.html"><button  type="button" class="btn btn-primary">See Job Apply</button></a>
  </div>
   
   <div id="receivedApplicationsContainer" class="row g-3"></div>
      <!-- Cards will be injected here by JS -->
    </div>
  </div>
     
     <div id="footer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
    integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous">
  </script>
  <script src="/JS/work.js"></script>
  <script src="/JS/header.js"></script>
  <script src="/JS/footer.js"></script>
  <script src="/JS/site-header.js" ></script>
<script src="/JS/role-based-show-hide.js"></script>


<script>
(async function(){
  const containerId = 'receivedApplicationsContainer';

  async function authFetch(url, opts = {}) {
    opts = Object.assign({}, opts);
    opts.headers = Object.assign({}, opts.headers || {});
    const token = localStorage.getItem('token');
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    return fetch(url, opts);
  }

  function esc(v){ return String(v||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
  function statusClass(st){
    switch((st||'').toLowerCase()){
      case 'applied': return 'bg-primary text-white';
      case 'reviewed': return 'bg-info text-white';
      case 'accepted': return 'bg-success text-white';
      case 'rejected': return 'bg-danger text-white';
      default: return 'bg-secondary text-white';
    }
  }

  async function updateStatus(appId, status, cardEl) {
    try {
      const res = await authFetch(`/api/application/internship/${encodeURIComponent(appId)}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status })
      });
      if (!res.ok) throw new Error(await res.text());
      const badge = cardEl.querySelector('.status-badge');
      if (badge) { badge.className = 'badge status-badge ' + statusClass(status); badge.innerText = status; }
      const det = cardEl.querySelector('.app-detail'); if (det) det.remove();
    } catch (err) {
      console.error('updateStatus', err);
      alert('Status update failed: ' + (err.message||err));
    }
  }

  async function loadReceivedApplications() {
    const container = document.getElementById(containerId);
    if (!container) return console.error('Missing container #' + containerId);
    container.innerHTML = '<p>Loading...</p>';

    const role = (localStorage.getItem('role')||'').toLowerCase();
    if (role !== 'recruiter') { container.innerHTML = '<p>Recruiter login required.</p>'; return; }

    try {
      const res = await authFetch('/api/application/internship/received-applications', { method: 'GET', cache: 'no-store' });
      if (!res.ok) {
        const txt = await res.text();
        throw new Error(txt || ('Status ' + res.status));
      }
      const body = await res.json();
      const apps = body.applications || [];
      if (!apps.length) { container.innerHTML = '<p>No applications found.</p>'; return; }

      container.innerHTML = '';
      apps.forEach(a => {
        const id = a.id || a._id || a.applicationId;
        const title = esc(a.internshipTitle || a.title || 'No title');
        const company = esc(a.company || a.recruiterName || '-');
        const candidate = esc(a.candidateName || a.candidate || '-');
        const status = esc(a.status || 'applied');
        const appliedAt = a.appliedAt ? new Date(a.appliedAt).toLocaleString() : (a.appliedAtRaw ? new Date(a.appliedAtRaw).toLocaleString() : '');

        const col = document.createElement('div');
        col.className = 'col-12 col-md-6 col-lg-4 mb-3';
        col.setAttribute('data-app-id', id);
        col.innerHTML = `
          <div class="card h-100">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">${title}</h5>
              <p class="card-text"><strong>Company:</strong> ${company}</p>
              <p class="card-text"><strong>Candidate:</strong> ${candidate}</p>
              <p class="card-text"><small class="text-muted">Applied: ${esc(appliedAt)}</small></p>
              <p class="mt-auto"><strong>Status:</strong> <span class="badge status-badge ${statusClass(status)}">${status}</span></p>
              <div class="mt-2 d-flex gap-2">
                <button class="btn btn-sm btn-outline-primary view-btn">View</button>
                <button class="btn btn-sm btn-success accept-btn">Accept</button>
                <button class="btn btn-sm btn-danger reject-btn">Reject</button>
              </div>
            </div>
          </div>`;
        container.appendChild(col);

        const viewBtn = col.querySelector('.view-btn');
        const acceptBtn = col.querySelector('.accept-btn');
        const rejectBtn = col.querySelector('.reject-btn');

        // Redirect to page view with appId query param
        viewBtn.addEventListener('click', () => {
          window.location.href = `/view-received-applications.html?appId=${encodeURIComponent(id)}`;
        });

        acceptBtn.addEventListener('click', async () => updateStatus(id, 'accepted', col));
        rejectBtn.addEventListener('click', async () => updateStatus(id, 'rejected', col));
      });

    } catch (err) {
      console.error('loadReceivedApplications', err);
      container.innerHTML = '<p>Failed to load applications.</p>';
      alert('Error: ' + (err.message || err));
    }
  }

  // keep toggleDetail available if you need inline details elsewhere
  async function toggleDetail(appId, cardEl) {
    const existing = cardEl.querySelector('.app-detail');
    if (existing) { existing.remove(); return; }

    try {
      const res = await authFetch(`/api/application${encodeURIComponent(appId)}`, { method: 'GET' });
      if (!res.ok) throw new Error(await res.text());
      const body = await res.json();
      const app = body.application || body;
      const form = app.formData || app;

      const det = document.createElement('div');
      det.className = 'app-detail mt-3 p-3 border rounded';
      let html = `<p><strong>Candidate:</strong> ${esc(app.candidateName || (app.candidate && app.candidate.fullName) || '')}</p>`;
      html += `<p><strong>Email / User:</strong> ${esc((app.candidate && app.candidate.user) || '')}</p>`;
      html += `<p><strong>Applied At:</strong> ${esc(new Date(app.appliedAt || app.createdAt || Date.now()).toLocaleString())}</p><hr/>`;
      html += `<h6>Form data</h6><pre style="white-space:pre-wrap;font-family:monospace;">${esc(JSON.stringify(form, null,2))}</pre>`;
      if (app.resumeUrl) html += `<hr/><p><strong>Resume:</strong> <a href="${esc(app.resumeUrl)}" target="_blank">Open</a></p>`;
      html += `<div class="mt-2 d-flex gap-2"><button class="btn btn-sm btn-success detail-accept">Accept</button><button class="btn btn-sm btn-danger detail-reject">Reject</button><button class="btn btn-sm btn-secondary detail-close">Close</button></div>`;
      det.innerHTML = html;
      cardEl.querySelector('.card-body').appendChild(det);

      det.querySelector('.detail-close').addEventListener('click', () => det.remove());
      det.querySelector('.detail-accept').addEventListener('click', async () => { await updateStatus(appId, 'accepted', cardEl); });
      det.querySelector('.detail-reject').addEventListener('click', async () => { await updateStatus(appId, 'rejected', cardEl); });
    } catch (err) {
      console.error('toggleDetail', err);
      alert('Failed to load detail: ' + (err.message||err));
    }
  }

  window.addEventListener('DOMContentLoaded', loadReceivedApplications);
})();
</script>


  </body>
</html>
