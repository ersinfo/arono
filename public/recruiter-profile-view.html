<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Profile View</title>
     <link rel="icon" href="/images/aronofy logo.png" type="image/png" />
  <link rel="stylesheet" href="/CSS/style.css" />
  <link rel="stylesheet" href="/CSS/media.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
</head>
<body style="margin-top: 93px;">


     <div id="header"></div>

      <div class="container py-4">
    <div class="d-flex align-items-center mb-3">
      <h3 class="mb-0">My Profile</h3>
      <span id="profileStatus" class="badge ms-3"></span>
      <div class="ms-auto">
        <a href="/recruiter-profile.html?edit=1" class="btn btn-primary">Edit Profile</a>
      </div>
    </div>

    <!-- Card -->
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="row g-4">
          <div class="col-md-3 text-center">
            <img id="companyLogo" src="" alt="Company Logo" class="img-fluid rounded border" style="max-height:160px; object-fit:contain;">
          </div>
          <div class="col-md-9">
            <h4 id="companyName" class="mb-1">—</h4>
            <div class="text-muted small mb-2">
              <span id="industryType">—</span>
              <span class="mx-2">•</span>
              <span id="companySize">—</span>
              <span class="mx-2">•</span>
              <span id="headquarters">—</span>
            </div>

            <div class="mb-2">
              <strong>Website:</strong>
              <a id="companyWebsite" href="#" target="_blank" rel="noopener">—</a>
            </div>

            <div class="mb-3">
              <strong>Description:</strong>
              <div id="companyDescription" class="mt-1">—</div>
            </div>

            <hr>

            <div class="row">
              <div class="col-md-6 mb-2"><strong>Designation:</strong> <span id="designation">—</span></div>
              <div class="col-md-6 mb-2"><strong>Department:</strong> <span id="department">—</span></div>
              <div class="col-md-6 mb-2">
                <strong>LinkedIn:</strong> <a id="linkedin" href="#" target="_blank" rel="noopener">—</a>
              </div>
              <div class="col-md-6 mb-2"><strong>Govt. Business ID:</strong> <span id="govtBusinessId">—</span></div>
            </div>

            <div class="text-muted small mt-3">
              <span>Last updated: <span id="updatedAt">—</span></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="alert alert-warning mt-3 d-none">
      Profile not found. Please complete your profile first.
      <a href="/recruiter-profile.html" class="alert-link">Go to Profile Form →</a>
    </div>
  </div>

      <div id="footer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
    integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous">
  </script>
  <script src="/JS/work.js"></script>
  <script src="/JS/header.js"></script>
  <script src="/JS/footer.js"></script>
  <script src="/JS/site-header.js"></script>
  <script src="/JS/recruiter-profile-view.js" defer></script>
    <script src="/JS/role-based-show-hide.js"></script>
</body>
</html>
