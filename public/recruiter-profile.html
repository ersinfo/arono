<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
   <link rel="icon" href="/images/aronofy logo.png" type="image/png" />
  <title>Aronofy</title>

  <link rel="stylesheet" href="/CSS/style.css" />
  <link rel="stylesheet" href="/CSS/media.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
</head>
<body style="margin-top:90px;">

     
<div id="header"></div>


  <div class="container mt-4">
    <h2>Complete Your Recruiter Profile</h2>
    <p class="text-muted">Add your company & work details so candidates can trust your postings.</p>

    <form id="recruiterProfileForm" enctype="multipart/form-data">
      <!-- Step 2: Company Details -->
      <h4 class="mt-4">Company Details</h4>
      <div class="mb-3">
        <label>Company Name*</label>
        <input type="text" class="form-control" name="companyName" required>
      </div>
      <div class="mb-3">
        <label>Company Website</label>
        <input type="url" class="form-control" name="companyWebsite">
      </div>
      <div class="mb-3">
        <label>Company Logo</label>
        <input type="file" class="form-control" name="companyLogo" accept="image/*">
      </div>
      <div class="mb-3">
        <label>Company Size</label>
        <select class="form-select" name="companySize">
          <option value="">Select</option>
          <option>1–10 employees</option>
          <option>11–50 employees</option>
          <option>51–200 employees</option>
          <option>201–500 employees</option>
          <option>500+ employees</option>
        </select>
      </div>
      <div class="mb-3">
        <label>Industry Type</label>
        <input type="text" class="form-control" name="industryType">
      </div>
      <div class="mb-3">
        <label>Headquarters / Location</label>
        <input type="text" class="form-control" name="headquarters">
      </div>
      <div class="mb-3">
        <label>Company Description</label>
        <textarea class="form-control" name="companyDescription" rows="3"></textarea>
      </div>

      <!-- Step 3: Recruiter Work Information -->
      <h4 class="mt-4">Your Work Information</h4>
      <div class="mb-3">
        <label>Designation*</label>
        <input type="text" class="form-control" name="designation" required>
      </div>
      <div class="mb-3">
        <label>LinkedIn Profile</label>
        <input type="url" class="form-control" name="linkedin">
      </div>
      <div class="mb-3">
        <label>Department</label>
        <input type="text" class="form-control" name="department">
      </div>

      <!-- Step 4: Optional / Verification Details -->
      <h4 class="mt-4">Optional / Verification</h4>
      <div class="mb-3">
        <label>Government Business ID</label>
        <input type="text" class="form-control" name="govtBusinessId">
      </div>

      <button type="submit" class="btn btn-primary mt-3">Save Profile</button>

    </form>
  </div>

  <div id="footer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
    integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous">
  </script>
  <script src="/JS/work.js"></script>
  <script src="/JS/header.js"></script>
  <script src="/JS/footer.js"></script>
  <script src="/JS/site-header.js"></script>
  <script src="/JS/auth-gate.js" defer></script>
  <script src="/JS/recruiter-profile.js"></script>
  <script src="/JS/recruiter-profile-view.js" defer></script>
  <script src="/JS/role-based-show-hide.js"></script>
</body>
</html>
