<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>See Job</title>
    <link rel="icon" href="/images/aronofy logo.png" type="image/png" />
     <link rel="stylesheet" href="/CSS/style.css" />
  <link rel="stylesheet" href="/CSS/media.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
</head>
<body style="margin-top:90px;">
  <div id="header"></div>

  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3>Open Jobs</h3>
      <a href="/post-job" id="postJobBtn" class="btn btn-success">Post Job</a>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-md-4">
        <input id="searchInput" class="form-control" placeholder="Search title / company / location" />
      </div>
      <div class="col-md-3">
        <select id="typeFilter" class="form-select">
          <option value="">All Types</option>
          <option>Full-time</option>
          <option>Part-time</option>
          <option>Internship</option>
          <option>Contract</option>
        </select>
      </div>
      <div class="col-md-2">
        <select id="activeFilter" class="form-select">
          <option value="true">Active</option>
          <option value="">All</option>
        </select>
      </div>
    </div>

      <!-- Grid container for cards -->
    <div class="row" id="jobsContainer"></div>

    <div id="empty" class="text-muted d-none">No jobs found.</div>
  </div>

  <div id="footer"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"
    integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
    integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous">
  </script>
  <script src="/JS/work.js"></script>
  <script src="/JS/header.js"></script>
  <script src="/JS/footer.js"></script>
  <script src="/JS/site-header.js"></script>
<script src="/JS/role-check.js"></script>
<script src="/JS/role-based-show-hide.js"></script>
 <script>
  (function(){
    const searchInput = document.getElementById('searchInput');
    const typeFilter = document.getElementById('typeFilter');
    const activeFilter = document.getElementById('activeFilter');
    const jobsContainer = document.getElementById('jobsContainer');
    const empty = document.getElementById('empty');

    let jobs = [];

    function escapeHtml(s=''){return String(s).replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

    async function load(){
      const params = new URLSearchParams();
      if (activeFilter.value) params.set('active', activeFilter.value);
      if (typeFilter.value) params.set('type', typeFilter.value);
      if (searchInput.value) params.set('q', searchInput.value.trim());
      const res = await fetch('/api/jobs?' + params.toString(), { cache: 'no-store' });
      if (!res.ok) {
        empty.textContent = 'Failed to load jobs.';
        empty.classList.remove('d-none');
        return;
      }
      const data = await res.json();
      jobs = Array.isArray(data) ? data : (data.jobs || []);
      applyFilterAndRender();
    }

    function renderList(list) {
      jobsContainer.innerHTML = '';
      if (!list.length) {
        empty.classList.remove('d-none');
        return;
      }
      empty.classList.add('d-none');

      for (const j of list) {
        const id = (j._id || j.id || j.jobId || '');
        const title = escapeHtml(j.title || 'Untitled');
        const company = escapeHtml(j.company || 'Unknown');
        const location = escapeHtml(j.location || 'N/A');
        const type = escapeHtml(j.jobType || '');
        const status = j.isActive ? 'Active' : 'Closed';
        const desc = escapeHtml((j.description||'').slice(0,150));
        const posted = j.createdAt ? new Date(j.createdAt).toLocaleDateString() : '';

        const div = document.createElement('div');
        div.className = 'col-md-4 mb-4';
        div.innerHTML = `
          <div class="card shadow-sm h-100">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">${title}</h5>
              <h6 class="card-subtitle mb-2 text-muted">${company} • ${location}</h6>
              <p class="card-text small mb-2">${desc}${(j.description||'').length>150?'...':''}</p>
              <div class="mt-auto d-flex justify-content-between align-items-center">
                <div class="small text-muted">
                  <div>Type: ${type}</div>
                  <div>Status: ${status}</div>
                  <div>Posted: ${posted}</div>
                </div>
                <a href="/see-job-view.html?id=${encodeURIComponent(id)}" class="btn btn-sm btn-primary">View</a>
              </div>
            </div>
          </div>
        `;
        jobsContainer.appendChild(div);
      }
    }

    function applyFilterAndRender(){
      const q = (searchInput.value || '').trim().toLowerCase();
      const t = typeFilter.value;
      const filtered = jobs.filter(j => {
        if (t && j.jobType !== t) return false;
        if (!q) return true;
        return (j.title||'').toLowerCase().includes(q) || (j.company||'').toLowerCase().includes(q) || (j.location||'').toLowerCase().includes(q);
      });
      renderList(filtered);
    }

    searchInput.addEventListener('input', () => { applyFilterAndRender(); });
    typeFilter.addEventListener('change', load);
    activeFilter.addEventListener('change', load);

    load().catch(()=> {
      empty.textContent = 'Failed to load jobs.';
      empty.classList.remove('d-none');
    });
  })();
  </script>

    
</body>
</html>
